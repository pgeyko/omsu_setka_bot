services:
  omsu_mirror:
    build:
      context: ../omsu_mirror
      dockerfile: Dockerfile
    container_name: omsu_mirror-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - ADMIN_KEY=your-secret-admin-key
      - CORS_ALLOWED_ORIGINS=*
      - SQLITE_PATH=/app/data/mirror.db
      - APP_ENV=development
      - RATE_LIMIT_GENERAL=9999
    volumes:
      - mirror_data:/app/data

  groupbot:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: groupbot-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/groupbot.db
      - CONFIG_PATH=/app/config.yaml
      - SETKA_BASE_URL=http://omsu_mirror:8080
      - SETKA_ADMIN_KEY=your-secret-admin-key
    volumes:
      - .:/app
      - groupbot_data:/app/data
    depends_on:
      - omsu_mirror

volumes:
  groupbot_data:
  mirror_data:
