services:
  bot:
    image: ghcr.io/pgeyko/omsu_setka_bot/bot:latest
    container_name: omsu_setka_bot
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/groupbot.db
      - CONFIG_PATH=/app/config.yaml
    volumes:
      - bot_data:/app/data

volumes:
  bot_data:
