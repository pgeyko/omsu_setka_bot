      security:
      - BearerAuth: []
      summary: List superadmins
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Add a new user as a superadmin
      parameters:
      - description: Superadmin data
        in: body
        name: body
        required: true
        schema:
