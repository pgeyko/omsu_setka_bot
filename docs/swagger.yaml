  /api/admin/groups/register-webhooks:
    post:
      description: Re-register webhook configurations for all active groups in Setka
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Register webhooks with Setka
      tags:
      - Admin
  /api/admin/superadmins:
    get:
