name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/pgeyko/omsu_setka_bot/bot

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test -race -v ./...

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run lint
        working-directory: admin
        continue-on-error: true
      - run: npm run build
        working-directory: admin

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SCHEDULE_WEBHOOK_SECRET: ${{ secrets.SCHEDULE_WEBHOOK_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SETKA_BASE_URL: ${{ secrets.SETKA_BASE_URL }}
      SETKA_ADMIN_KEY: ${{ secrets.SETKA_ADMIN_KEY }}
      SETKA_PUBLIC_URL: ${{ secrets.SETKA_PUBLIC_URL }}
      APP_ENV: ${{ secrets.APP_ENV }}
      ANNOUNCE_THREAD_ID: ${{ secrets.ANNOUNCE_THREAD_ID }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "SSH secrets not configured, skipping deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Prepare deploy dir and compose file on server
          ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p ~/bot"

          # Upload docker-compose.prod.yml
          scp -o StrictHostKeyChecking=no \
            docker-compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:~/bot/docker-compose.yml"

          # Write env vars to .env file
          ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat > ~/bot/.env << 'ENVEOF'
BOT_TOKEN=$BOT_TOKEN
ADMIN_SECRET=$ADMIN_SECRET
JWT_SECRET=$JWT_SECRET
SCHEDULE_WEBHOOK_SECRET=$SCHEDULE_WEBHOOK_SECRET
GROQ_API_KEY=$GROQ_API_KEY
GROQ_API_KEY_2=$GROQ_API_KEY_2
GEMINI_API_KEY=$GEMINI_API_KEY
OPENROUTER_API_KEY=$OPENROUTER_API_KEY
$( [ -n "$SETKA_BASE_URL" ] && echo "SETKA_BASE_URL=$SETKA_BASE_URL" )
$( [ -n "$SETKA_ADMIN_KEY" ] && echo "SETKA_ADMIN_KEY=$SETKA_ADMIN_KEY" )
$( [ -n "$SETKA_PUBLIC_URL" ] && echo "SETKA_PUBLIC_URL=$SETKA_PUBLIC_URL" )
$( [ -n "$APP_ENV" ] && echo "APP_ENV=$APP_ENV" )
$( [ -n "$ANNOUNCE_THREAD_ID" ] && echo "ANNOUNCE_THREAD_ID=$ANNOUNCE_THREAD_ID" )
$( [ -n "$CORS_ORIGIN" ] && echo "CORS_ORIGIN=$CORS_ORIGIN" )
ENVEOF
             chmod 600 ~/bot/.env
             cd ~/bot
             docker compose --env-file .env pull bot
             docker compose --env-file .env up -d bot"
          echo "Deploy completed"
