name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/pgeyko/omsu_setka_bot/bot

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum
      - name: Run tests
        run: |
          go test -v ./...

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        run: |
          cd admin
          npm ci
      - name: Verify build
        run: |
          cd admin
          npm run build

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.DEPLOY_PATH || '~/omsu_setka_bot' }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
          OMSU_GROUP_ID: ${{ secrets.OMSU_GROUP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_RESERVE_API_KEY: ${{ secrets.GEMINI_RESERVE_API_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SCHEDULE_WEBHOOK_SECRET: ${{ secrets.SCHEDULE_WEBHOOK_SECRET }}
          SETKA_BASE_URL: ${{ secrets.SETKA_BASE_URL }}
          SETKA_ADMIN_KEY: ${{ secrets.SETKA_ADMIN_KEY }}
          SETKA_PUBLIC_URL: ${{ secrets.SETKA_PUBLIC_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: BOT_TOKEN,GROUP_ID,OMSU_GROUP_ID,GEMINI_API_KEY,DEEPSEEK_API_KEY,GEMINI_RESERVE_API_KEY,ADMIN_SECRET,JWT_SECRET,SCHEDULE_WEBHOOK_SECRET,SETKA_BASE_URL,SETKA_ADMIN_KEY,SETKA_PUBLIC_URL
          script: |
            mkdir -p ${{ secrets.DEPLOY_PATH || '~/omsu_setka_bot' }}
            cd ${{ secrets.DEPLOY_PATH || '~/omsu_setka_bot' }}

            cat <<EOF > .env.prod
            APP_ENV=production
            LOG_LEVEL=info
            LOG_FORMAT=json
            BOT_TOKEN=$BOT_TOKEN
            GROUP_ID=$GROUP_ID
            OMSU_GROUP_ID=$OMSU_GROUP_ID
            GEMINI_API_KEY=$GEMINI_API_KEY
            DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY
            GEMINI_RESERVE_API_KEY=$GEMINI_RESERVE_API_KEY
            ADMIN_SECRET=$ADMIN_SECRET
            JWT_SECRET=$JWT_SECRET
            SCHEDULE_WEBHOOK_SECRET=$SCHEDULE_WEBHOOK_SECRET
            SETKA_BASE_URL=$SETKA_BASE_URL
            SETKA_ADMIN_KEY=$SETKA_ADMIN_KEY
            SETKA_PUBLIC_URL=$SETKA_PUBLIC_URL
            CORS_ORIGIN=https://${{ secrets.SERVER_HOST }}
            EOF

            docker network inspect nginx-network >/dev/null 2>&1 || docker network create nginx-network

            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

            docker image prune -f
