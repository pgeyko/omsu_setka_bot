timezone: "Asia/Omsk"

telegram:
  token: "${BOT_TOKEN}"
  group_id: -1000000000000
  omsu_group_id: 12345

llm:
  daily_token_limit: 100000
  classify_confidence_threshold: 0.75
  request_timeout_sec: 10
  circuit_breaker_failures: 3
  circuit_breaker_cooldown_min: 5
  skip_fallback_model: false

  providers:
    # ── Text chain ── (classify, agent, summary, schedule)
    - name: gemma-text
      type: gemini
      api_key: "${GEMINI_API_KEY}"
      model: gemma-4-31b-it
      multimodal: false
      priority: 10

    - name: gemma-text-reserve
      type: gemini
      api_key: "${GEMINI_RESERVE_API_KEY}"
      model: gemma-4-31b-it
      multimodal: false
      priority: 20

    - name: gemini-text-fallback
      type: gemini
      api_key: "${GEMINI_API_KEY}"
      model: gemini-3.1-flash-lite
      multimodal: false
      priority: 30

    - name: gemini-text-fallback-reserve
      type: gemini
      api_key: "${GEMINI_RESERVE_API_KEY}"
      model: gemini-3.1-flash-lite
      multimodal: false
      priority: 40

    - name: deepseek-final
      type: deepseek
      api_key: "${DEEPSEEK_API_KEY}"
      model: deepseek-chat
      multimodal: false
      priority: 90

    # ── Vision chain ── (OCR, фото)
    - name: gemini-vision
      type: gemini
      api_key: "${GEMINI_API_KEY}"
      model: gemini-3.1-flash-lite
      multimodal: true
      priority: 50

    - name: gemini-vision-reserve
      type: gemini
      api_key: "${GEMINI_RESERVE_API_KEY}"
      model: gemini-3.1-flash-lite
      multimodal: true
      priority: 60

    # ── Audio chain ── (голосовые, Native Audio Dialog)
    - name: gemini-audio
      type: gemini
      api_key: "${GEMINI_API_KEY}"
      model: gemini-2.5-flash
      multimodal: true
      priority: 70

    - name: gemini-audio-fallback
      type: gemini
      api_key: "${GEMINI_RESERVE_API_KEY}"
      model: gemini-2.5-flash
      multimodal: true
      priority: 80

api:
  listen: ":8081"
  admin_secret: "${ADMIN_SECRET}"
  jwt_secret: "${JWT_SECRET}"
  cors_origin: "*"

webhook:
  schedule_secret: "${SCHEDULE_WEBHOOK_SECRET}"
  announce_thread_id: 10

db:
  path: "./data/groupbot.db"

rate_limit:
  global_per_user_per_min: 5
  summary_per_user_min: 30

setka:
  base_url: ""
  admin_key: ""
