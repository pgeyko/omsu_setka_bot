timezone: "Asia/Omsk"

telegram:
  token: "${BOT_TOKEN}"
  group_id: -1000000000000
  omsu_group_id: 12345

llm:
  daily_token_limit: 200000
  classify_confidence_threshold: 0.75
  request_timeout_sec: 15
  circuit_breaker_failures: 3
  circuit_breaker_cooldown_min: 5
  skip_fallback_model: false

  providers:
    # ── Agent chain ── (agent_loop) all Groq first, Google last
    - name: groq-agent
      type: groq
      chain: agent
      api_key: "${GROQ_API_KEY}"
      model: llama-3.3-70b-versatile
      rpm_limit: 60
      rpd_limit: 2000
      tpm_limit: 24000
      tpd_limit: 200000
      priority: 10

    - name: groq-agent-key2
      type: groq
      chain: agent
      api_key: "${GROQ_API_KEY_2}"
      model: llama-3.3-70b-versatile
      rpm_limit: 60
      rpd_limit: 2000
      tpm_limit: 24000
      tpd_limit: 200000
      priority: 15

    - name: groq-agent-fallback
      type: groq
      chain: agent
      api_key: "${GROQ_API_KEY}"
      model: qwen/qwen3-32b
      rpm_limit: 120
      rpd_limit: 2000
      tpm_limit: 12000
      tpd_limit: 1000000
      priority: 20

    - name: groq-agent-fallback-key2
      type: groq
      chain: agent
      api_key: "${GROQ_API_KEY_2}"
      model: qwen/qwen3-32b
      rpm_limit: 120
      rpd_limit: 2000
      tpm_limit: 12000
      tpd_limit: 1000000
      priority: 25

    - name: gemini-agent
      type: gemini
      chain: agent
      api_key: "${GEMINI_API_KEY}"
      model: gemma-4-31b-it
      rpm_limit: 30
      rpd_limit: 3000
      priority: 30

    - name: gemini-agent-fallback
      type: gemini
      chain: agent
      api_key: "${GEMINI_API_KEY}"
      model: gemma-4-26b-a4b-it
      rpm_limit: 30
      rpd_limit: 3000
      priority: 40

    - name: openrouter-agent
      type: groq
      chain: agent
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "https://openrouter.ai/api"
      model: openai/gpt-oss-120b:free
      priority: 50

    - name: openrouter-agent-fallback
      type: groq
      chain: agent
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "https://openrouter.ai/api"
      model: openrouter/free
      priority: 55

    # ── Simple chain ── (classify, simple responses, diagnostic) all Groq first, Google last
    - name: groq-simple
      type: groq
      chain: simple
      api_key: "${GROQ_API_KEY}"
      model: llama-3.1-8b-instant
      rpm_limit: 120
      rpd_limit: 2000
      tpm_limit: 12000
      tpd_limit: 1000000
      priority: 10

    - name: groq-simple-key2
      type: groq
      chain: simple
      api_key: "${GROQ_API_KEY_2}"
      model: llama-3.1-8b-instant
      rpm_limit: 120
      rpd_limit: 2000
      tpm_limit: 12000
      tpd_limit: 1000000
      priority: 15

    - name: groq-simple-fallback
      type: groq
      chain: simple
      api_key: "${GROQ_API_KEY}"
      model: qwen/qwen3-32b
      rpm_limit: 60
      rpd_limit: 2000
      tpm_limit: 12000
      tpd_limit: 1000000
      priority: 20

    - name: groq-simple-fallback-key2
      type: groq
      chain: simple
      api_key: "${GROQ_API_KEY_2}"
      model: qwen/qwen3-32b
      rpm_limit: 60
      rpd_limit: 2000
      tpm_limit: 12000
      tpd_limit: 1000000
      priority: 25

    - name: gemini-simple
      type: gemini
      chain: simple
      api_key: "${GEMINI_API_KEY}"
      model: gemini-3.1-flash-lite
      rpm_limit: 30
      rpd_limit: 3000
      tpm_limit: 500000
      priority: 30

    - name: gemini-simple-fallback
      type: gemini
      chain: simple
      api_key: "${GEMINI_API_KEY}"
      model: gemini-3.1-flash-lite
      rpm_limit: 30
      rpd_limit: 3000
      tpm_limit: 500000
      priority: 40

    - name: openrouter-simple
      type: groq
      chain: simple
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "https://openrouter.ai/api"
      model: openai/gpt-oss-20b:free
      priority: 50

    - name: openrouter-simple-fallback
      type: groq
      chain: simple
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "https://openrouter.ai/api"
      model: openrouter/free
      priority: 55

    # ── Vision chain ── (OCR, фото) Groq → Gemini → Gemini
    - name: groq-vision
      type: groq
      chain: vision
      api_key: "${GROQ_API_KEY}"
      model: meta-llama/llama-4-scout-17b-16e-instruct
      rpm_limit: 60
      rpd_limit: 2000
      tpm_limit: 60000
      tpd_limit: 1000000
      priority: 10

    - name: groq-vision-key2
      type: groq
      chain: vision
      api_key: "${GROQ_API_KEY_2}"
      model: meta-llama/llama-4-scout-17b-16e-instruct
      rpm_limit: 60
      rpd_limit: 2000
      tpm_limit: 60000
      tpd_limit: 1000000
      priority: 15

    - name: gemini-vision
      type: gemini
      chain: vision
      api_key: "${GEMINI_API_KEY}"
      model: gemini-3.1-flash-lite
      rpm_limit: 30
      rpd_limit: 1000
      tpm_limit: 500000
      priority: 20

    - name: gemini-vision-fallback
      type: gemini
      chain: vision
      api_key: "${GEMINI_API_KEY}"
      model: gemma-4-31b-it
      rpm_limit: 30
      rpd_limit: 3000
      priority: 30

    # ── Audio chain ── (STT, голосовые) flash-lite primary, whisper fallback
    - name: gemini-audio
      type: gemini
      chain: audio
      api_key: "${GEMINI_API_KEY}"
      model: gemini-3.1-flash-lite
      rpm_limit: 30
      rpd_limit: 1000
      tpm_limit: 1000000
      priority: 10

    - name: groq-audio
      type: groq
      chain: audio
      api_key: "${GROQ_API_KEY}"
      model: whisper-large-v3-turbo
      rpm_limit: 40
      rpd_limit: 4000
      priority: 20

    - name: groq-audio-key2
      type: groq
      chain: audio
      api_key: "${GROQ_API_KEY_2}"
      model: whisper-large-v3-turbo
      rpm_limit: 40
      rpd_limit: 4000
      priority: 25

    - name: groq-audio-fallback
      type: groq
      chain: audio
      api_key: "${GROQ_API_KEY}"
      model: whisper-large-v3
      rpm_limit: 40
      rpd_limit: 4000
      priority: 30

    - name: groq-audio-fallback-key2
      type: groq
      chain: audio
      api_key: "${GROQ_API_KEY_2}"
      model: whisper-large-v3
      rpm_limit: 40
      rpd_limit: 4000
      priority: 35

api:
  listen: ":8081"
  admin_secret: "${ADMIN_SECRET}"
  jwt_secret: "${JWT_SECRET}"
  cors_origin: "*"

webhook:
  schedule_secret: "${SCHEDULE_WEBHOOK_SECRET}"
  announce_thread_id: 10

db:
  path: "./data/groupbot.db"

rate_limit:
  global_per_user_per_min: 10
  summary_per_user_min: 60

setka:
  base_url: ""
  admin_key: ""
