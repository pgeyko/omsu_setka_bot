services:
  bot:
    image: ghcr.io/pgeyko/omsu_setka_bot/bot:latest
    container_name: omsu_setka_bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - .env.prod
    volumes:
      - bot_data:/app/data
    networks:
      - nginx-network
      - default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/auth/token"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bot_data:

networks:
  nginx-network:
    external: true
